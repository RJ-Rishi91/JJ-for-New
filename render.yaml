services:
  - type: web
    name: junior-journalist-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: junior_journalist
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
